global:
  scrape_interval: 5s

  evaluation_interval: 5s


scrape_configs:

  # =====================================
  # OpenTelemetry Collector
  # =====================================
  - job_name: otel-collector

    static_configs:

      - targets:
          - otel-collector:8889


  # =====================================
  # Prometheus itself
  # =====================================
  - job_name: prometheus

    static_configs:

      - targets:
          - prometheus:9090
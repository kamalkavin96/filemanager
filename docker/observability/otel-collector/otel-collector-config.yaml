receivers:

  otlp:
    protocols:

      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318


processors:

  batch:


exporters:

  # ==========================
  # Traces -> Tempo
  # ==========================
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true


  # ==========================
  # Metrics -> Prometheus
  # ==========================
  prometheus:
    endpoint: "0.0.0.0:8889"


  # ==========================
  # Logs -> Loki
  # ==========================
  otlphttp/loki:
    endpoint: http://loki:3100/otlp


  # Debug exporter
  debug:
    verbosity: basic


service:

  pipelines:

    # --------------------------
    # TRACES
    # --------------------------
    traces:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlp/tempo


    # --------------------------
    # METRICS
    # --------------------------
    metrics:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus


    # --------------------------
    # LOGS
    # --------------------------
    logs:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlphttp/loki